name: AKV Bedrock Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-bot:
    runs-on: ubuntu-latest

    timeout-minutes: 350

    steps:
      - name: Repository yuklash
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dependency o'rnatish
        run: npm install

      - name: AKV Bot ishga tushirish
        run: |
          echo "=============================================="
          echo "          AKV BEDROCK BOT"
          echo "=============================================="
          echo "Bot ishga tushmoqda..."
          echo "Server: Soloraft.aternos.me:27295"
          echo "=============================================="

          while true
          do
            echo ""
            echo "[GitHub] Node.js bot ishga tushirilmoqda..."

            node index.js

            EXIT_CODE=$?

            echo ""
            echo "[GitHub] Bot processi to'xtadi."
            echo "[GitHub] Exit code: $EXIT_CODE"
            echo "[GitHub] 5 soniyadan keyin qayta ishga tushiriladi..."

            sleep 5
          done
